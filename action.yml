name: "Codeceipt"
description: "Verify an AI-authored PR by execution and publish a public, re-runnable receipt."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  api-url:
    description: "Codeceipt API base URL (where receipts are published)."
    required: false
    default: "https://codeceipt.dev"
  openai-api-key:
    description: "Optional key to enable the llm_judge intent check. Omit to stay fully deterministic."
    required: false
  ingest-token:
    description: "Bearer token required by your Codeceipt instance to publish receipts."
    required: false
  fail-on-block:
    description: "Fail the check run when a blocking criterion fails."
    required: false
    default: "false"

outputs:
  verdict:
    description: "pass | fail"
    value: ${{ steps.run.outputs.verdict }}
  label:
    description: "VERIFIED | FAILED | PARTIAL"
    value: ${{ steps.run.outputs.label }}
  fingerprint:
    description: "Deterministic verification fingerprint."
    value: ${{ steps.run.outputs.fingerprint }}
  receipt-url:
    description: "Public receipt URL, if published."
    value: ${{ steps.run.outputs.receipt_url }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install engine
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --filter @codeceipt/engine... --prod=false || pnpm install --filter @codeceipt/engine...

    - name: Verify
      id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm exec tsx packages/engine/src/action-cli.ts
      env:
        # The user's checkout — the runner IS the sandbox. Declared `shell`
        # criteria run here for real (this is the "by execution" guarantee).
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
        CODECEIPT_API_URL: ${{ inputs.api-url }}
        CODECEIPT_INGEST_TOKEN: ${{ inputs.ingest-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        CODECEIPT_FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
